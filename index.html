<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Market Stories</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="navbar.css">
<link rel="stylesheet" href="chat-widget.css">
</head>


<body>


<!-- =======================================================
     BACKGROUND
======================================================== -->

<div id="stage">
  <div id="welcome-wrap">
    Welcome to Market Stories
  </div>
</div>


<!-- =======================================================
     THREE.JS CANVAS
======================================================== -->

<canvas
  id="gl"
  aria-label="Interactive 3D market scenes"
></canvas>


<!-- =======================================================
     UI
======================================================== -->

<main id="ui">


  <!-- MARKET INFORMATION -->

  <section id="shoe-info" class="shoe-info right">

    <div id="shoe-kicker" class="eyebrow">
      DAILY HARVEST
    </div>

    <h1 id="shoe-title">
      Daily Harvest
    </h1>

    <p id="shoe-tagline">
      Hand-picked, same-day
    </p>

    <p id="shoe-details">
      Weight 12kg<br>
      Items 18
    </p>

  </section>


  <!-- CONTROLS -->

  <div class="controls">

    <button
      id="prev"
      class="arrow"
      type="button"
      aria-label="Previous scene"
    >
      ←
    </button>


    <div
      id="dots"
      class="dots"
    ></div>


    <button
      id="next"
      class="arrow"
      type="button"
      aria-label="Next scene"
    >
      →
    </button>

  </div>


  <!-- HINT -->

  <div class="interaction-hint">

    <span>DRAG TO EXPLORE</span>

    <span class="line"></span>

    <span>SCROLL ↓</span>

  </div>


</main>


<!-- =======================================================
     THREE.JS
======================================================== -->

<script type="importmap">
{
  "imports": {
    "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

    "three/addons/":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>


<!-- =======================================================
     MAIN JAVASCRIPT
======================================================== -->

<script type="module" src="./script.js"></script>

<script src="navbar.js"></script>
<script src="chat-widget.js"></script>
</body>
</html>
